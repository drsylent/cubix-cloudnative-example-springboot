info:
  name: GET default message
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/demo/message

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res("message")
      operator: eq
      value: Hello Cloud-native students!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
