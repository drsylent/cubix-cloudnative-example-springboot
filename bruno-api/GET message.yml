info:
  name: GET message
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8080/demo/message?message=Hello From Postman!
  params:
    - name: message
      value: Hello From Postman!
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("Query param should appear in the response", function() {
          const message = req.getUrl().split("?")[1].split("=")[1];
          expect(res.getBody().message).to.equal(message);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
